<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin- ilikepancakes.ink</title>
    <meta name="description" content="ilikepancakes.ink blog">

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/imgs/favicon-32x32">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/imgs/favicon-16x16">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ilikepancakes.ink/blog">
    <meta property="og:title" content="Blog - ilikepancakes.ink">
    <meta property="og:description" content="ilikepancakes.ink blog">
    <meta property="og:image" content="https://ilikepancakes.ink/assets/imgs/favicon-32x32">
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://ilikepancakes.ink/blog">
    <meta property="twitter:title" content="Blog - ilikepancakes.ink">
    <meta property="twitter:description" content="ilikepancakes.ink blog">
    <meta property="twitter:image" content="https://ilikepancakes.ink/assets/imgs/favicon-32x32">
    <meta name="theme-color" content="#1a1a1a">

    <link rel="stylesheet" href="/assets/css/style">
</head>
<body>
    <h1><a href="/" style="color: #ffffff; text-decoration: none;">ilikepancakes.ink</a>/blog_admin</h1>

    <!-- Login Form -->
    <section id="login-form">
        <h2>Login</h2>
        <div id="login-error" style="color: #e06c75; display: none; margin-bottom: 10px;"></div>
        <form id="login" onsubmit="return doLogin(event)">
            <div style="margin-bottom: 15px;">
                <label for="username" style="display: block; margin-bottom: 5px; color: #ccc;">Username</label>
                <input type="text" id="username" name="username" required style="width: 100%; padding: 10px; background: #333; border: 1px solid #555; border-radius: 4px; color: #fff; font-size: 1em; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="password" style="display: block; margin-bottom: 5px; color: #ccc;">Password</label>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 10px; background: #333; border: 1px solid #555; border-radius: 4px; color: #fff; font-size: 1em; box-sizing: border-box;">
            </div>
            <button type="submit" class="button email">Login</button>
        </form>
    </section>

    <!-- Admin Panel -->
    <section id="admin-panel" style="display: none;">
        <h2>Blog Posts</h2>
        <div style="margin-bottom: 20px;">
            <button class="button" style="background: #48bb78; color: white; border: none; cursor: pointer;" onclick="showEditor()">+ New Post</button>
            <button class="button" style="background: #4a5568; color: white; border: none; cursor: pointer;" onclick="doLogout()">Logout</button>
        </div>
        <div id="admin-posts-list"></div>
    </section>

    <!-- Post Editor -->
    <section id="post-editor" style="display: none;">
        <h2 id="editor-title">New Post</h2>
        <form id="editor-form" onsubmit="return savePost(event)">
            <input type="hidden" id="edit-id" value="">
            <div style="margin-bottom: 15px;">
                <label for="edit-title" style="display: block; margin-bottom: 5px; color: #ccc;">Title</label>
                <input type="text" id="edit-title" required style="width: 100%; padding: 10px; background: #333; border: 1px solid #555; border-radius: 4px; color: #fff; font-size: 1em; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <label for="edit-content" style="display: block; margin-bottom: 5px; color: #ccc;">Content</label>
                <textarea id="edit-content" rows="15" required style="width: 100%; padding: 10px; background: #333; border: 1px solid #555; border-radius: 4px; color: #fff; font-size: 1em; font-family: inherit; box-sizing: border-box; resize: vertical;"></textarea>
            </div>

            <!-- Attachments Section -->
            <div style="margin-bottom: 15px; padding: 15px; background: #2a2a2a; border-radius: 6px; border: 1px solid #444;">
                <label style="display: block; margin-bottom: 10px; color: #ccc; font-weight: bold;">Attachments (max 10, up to 5GB each)</label>
                <div id="attachment-list" style="margin-bottom: 10px;"></div>
                <div id="attachment-upload-area">
                    <input type="file" id="attachment-files" multiple style="color: #ccc; margin-bottom: 10px;">
                    <button type="button" class="button" style="background: #61afef; color: white; border: none; cursor: pointer; padding: 8px 16px;" onclick="uploadAttachments()">Upload Files</button>
                    <div id="upload-progress" style="color: #888; font-size: 0.85em; margin-top: 5px;"></div>
                </div>
            </div>

            <div>
                <button type="submit" class="button email" style="border: none; cursor: pointer;">Save</button>
                <button type="button" class="button" style="background: #4a5568; color: white; border: none; cursor: pointer;" onclick="cancelEditor()">Cancel</button>
            </div>
        </form>
    </section>

    <script>
    let token = null;
    let currentEditPostId = null;

    async function doLogin(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('login-error');
        errorDiv.style.display = 'none';

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) {
                errorDiv.textContent = data.error || 'Login failed';
                errorDiv.style.display = 'block';
                return;
            }
            token = data.token;
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadAdminPosts();
        } catch (err) {
            errorDiv.textContent = 'Network error';
            errorDiv.style.display = 'block';
        }
        return false;
    }

    function doLogout() {
        token = null;
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('post-editor').style.display = 'none';
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    function handleAuthError(res) {
        if (res.status === 401) {
            token = null;
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('post-editor').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            const errorDiv = document.getElementById('login-error');
            errorDiv.textContent = 'Session expired. Please login again.';
            errorDiv.style.display = 'block';
            return true;
        }
        return false;
    }

    async function loadAdminPosts() {
        const res = await fetch('/api/posts', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (handleAuthError(res)) return;
        const posts = await res.json();
        const list = document.getElementById('admin-posts-list');
        list.innerHTML = '';
        if (posts.length === 0) {
            list.innerHTML = '<p>No posts yet.</p>';
            return;
        }
        posts.forEach(post => {
            const div = document.createElement('div');
            div.style.marginBottom = '15px';
            div.style.padding = '15px';
            div.style.background = '#333';
            div.style.borderRadius = '6px';
            const attCount = post.attachment_count || 0;
            div.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <strong style="font-size: 1.1em;">${escapeHtml(post.title)}</strong>
                        <p style="color: #888; font-size: 0.85em; margin: 5px 0 0 0;">${new Date(post.created_at).toLocaleDateString()} ${attCount > 0 ? `- ${attCount} attachment(s)` : ''}</p>
                    </div>
                    <div>
                        <button class="button" style="background: #61afef; color: white; border: none; cursor: pointer; padding: 8px 16px;" onclick="editPost(${post.id})">Edit</button>
                        <button class="button" style="background: #e06c75; color: white; border: none; cursor: pointer; padding: 8px 16px;" onclick="deletePost(${post.id})">Delete</button>
                    </div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function showEditor(post) {
        document.getElementById('admin-panel').style.display = 'none';
        document.getElementById('post-editor').style.display = 'block';
    }

    function cancelEditor() {
        document.getElementById('post-editor').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('edit-id').value = '';
        document.getElementById('edit-title').value = '';
        document.getElementById('edit-content').value = '';
        currentEditPostId = null;
        document.getElementById('attachment-list').innerHTML = '';
        document.getElementById('attachment-files').value = '';
    }

    async function editPost(id) {
        const res = await fetch('/api/posts/' + id, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (handleAuthError(res)) return;
        const post = await res.json();
        document.getElementById('editor-title').textContent = 'Edit Post';
        document.getElementById('edit-id').value = post.id;
        document.getElementById('edit-title').value = post.title;
        document.getElementById('edit-content').value = post.content;
        currentEditPostId = post.id;
        showEditor();
        renderAttachments(post.attachments || []);
    }

    async function deletePost(id) {
        if (!confirm('Delete this post?')) return;
        const res = await fetch('/api/admin/posts/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (handleAuthError(res)) return;
        loadAdminPosts();
    }

    async function savePost(event) {
        event.preventDefault();
        const id = document.getElementById('edit-id').value;
        const title = document.getElementById('edit-title').value;
        const content = document.getElementById('edit-content').value;

        const method = id ? 'PUT' : 'POST';
        const url = id ? '/api/admin/posts/' + id : '/api/admin/posts';

        const res = await fetch(url, {
            method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ title, content })
        });
        if (handleAuthError(res)) return false;

        const post = await res.json();
        // If this was a new post, update the edit id for attachment uploads
        if (!id) {
            document.getElementById('edit-id').value = post.id;
            currentEditPostId = post.id;
        }

        cancelEditor();
        loadAdminPosts();
        return false;
    }

    // Attachment functions
    function renderAttachments(attachments) {
        const list = document.getElementById('attachment-list');
        list.innerHTML = '';
        if (!attachments || attachments.length === 0) {
            list.innerHTML = '<p style="color: #888; font-size: 0.85em;">No attachments yet.</p>';
            return;
        }
        attachments.forEach(att => {
            const sizeStr = formatFileSize(att.file_size);
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.style.alignItems = 'center';
            div.style.padding = '8px 10px';
            div.style.marginBottom = '5px';
            div.style.background = '#333';
            div.style.borderRadius = '4px';
            div.innerHTML = `
                <span style="color: #ccc; font-size: 0.9em;">
                    <a href="/uploads/${att.filename}" target="_blank" style="color: #61afef; text-decoration: none;">${escapeHtml(att.original_name)}</a>
                    <span style="color: #888; font-size: 0.8em; margin-left: 8px;">(${sizeStr})</span>
                </span>
                <button class="button" style="background: #e06c75; color: white; border: none; cursor: pointer; padding: 4px 10px; font-size: 0.8em;" onclick="deleteAttachment(${att.id})">Remove</button>
            `;
            list.appendChild(div);
        });
    }

    async function uploadAttachments() {
        const fileInput = document.getElementById('attachment-files');
        const files = fileInput.files;
        const progressDiv = document.getElementById('upload-progress');

        if (!files || files.length === 0) {
            progressDiv.textContent = 'Please select files first.';
            return;
        }

        const postId = document.getElementById('edit-id').value;
        if (!postId) {
            progressDiv.textContent = 'Please save the post first before uploading attachments.';
            return;
        }

        const formData = new FormData();
        for (let i = 0; i < files.length; i++) {
            formData.append('files', files[i]);
        }

        progressDiv.textContent = `Uploading ${files.length} file(s)...`;

        try {
            const res = await fetch(`/api/admin/posts/${postId}/attachments`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                },
                body: formData
            });

            if (handleAuthError(res)) return;

            const data = await res.json();
            if (!res.ok) {
                progressDiv.textContent = 'Upload failed: ' + (data.error || 'Unknown error');
                return;
            }

            progressDiv.textContent = `Uploaded ${data.attachments.length} file(s) successfully.`;
            fileInput.value = '';

            // Reload post to get updated attachments
            const postRes = await fetch('/api/posts/' + postId, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!handleAuthError(postRes)) {
                const post = await postRes.json();
                renderAttachments(post.attachments || []);
            }
        } catch (err) {
            progressDiv.textContent = 'Network error during upload.';
        }
    }

    async function deleteAttachment(attachmentId) {
        if (!confirm('Delete this attachment?')) return;
        const postId = document.getElementById('edit-id').value;
        const res = await fetch(`/api/admin/posts/${postId}/attachments/${attachmentId}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (handleAuthError(res)) return;
        const data = await res.json();
        if (!data.success) return;

        // Reload post to get updated attachments
        const postRes = await fetch('/api/posts/' + postId, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!handleAuthError(postRes)) {
            const post = await postRes.json();
            renderAttachments(post.attachments || []);
        }
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        const size = (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0);
        return size + ' ' + units[i];
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    </script>
</body>
</html>
